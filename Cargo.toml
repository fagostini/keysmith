[package]
name = "keysmith"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# ponytail: one crate, two binaries. Split into ks-inputd / ks-engine crates
# when the engine grows deps (zbus, mlua) that inputd must not link.
[dependencies]
evdev = "0.13"
mlua = { version = "0.11", features = ["luau"] }
nix = { version = "0.29", features = ["socket", "ioctl"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.13"
xkbcommon = { version = "0.9.0", default-features = false }
zbus = "5"

# A panic anywhere must kill the process, so the kernel drops the grab and
# the virtual keyboard (releasing its keys) instead of leaving a half-dead broker.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
