# ~/.config/keysmith/hotkeys.conf — `combo = shell command`
# Modifiers: ctrl alt shift super. Keys: evdev names without KEY_ (t, f5, volumeup, enter).
# Text keys (letters, digits, space, enter…) need ctrl, alt or super; inputd refuses them otherwise.
ctrl+alt+t = kgx
super+f5 = notify-send keysmith "hotkeys work"

# Remaps (M2). Any remap makes inputd grab the keyboard and re-emit keys
# through a virtual keyboard. Emergency exit: hold Backspace + Esc + Enter.
remap capslock = tap:esc hold:leftctrl
# remap rightalt = leftmeta
taphold_ms = 200

# Hotstrings (M3). `:trigger` fires on the following space; `:*trigger` fires at once.
# Triggers need 3+ characters and no spaces. `\n` = Enter, `\t` = Tab.
# Characters your layout can't type (emoji, CJK) are pasted via the clipboard
# (needs wl-clipboard on Wayland or xclip on X11).
:btw = by the way
:*;sig = Best regards,\n
:shrug = ¯\\_(ツ)_/¯
# Layout used to type and decode; detected from the session if omitted.
# xkb_layout = de
# xkb_variant = nodeadkeys
